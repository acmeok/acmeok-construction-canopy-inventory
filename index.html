<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canopy Inventory</title>
<meta name="theme-color" content="#f5a300">
<meta name="description" content="Acme Construction canopy inventory">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="images/icon.png">
<link rel="apple-touch-icon" href="images/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Canopies">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #f4f4f1;
    --card: #ffffff;
    --text: #1b1b1b;
    --muted: #6b6b66;
    --line: #d9d9d3;
    --accent: #f5a300;
    --accent-dark: #c98600;
    --ok: #1f7a3d;
    --ok-bg: #e3f4e8;
    --err: #b3261e;
    --err-bg: #fbe7e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --card: #1f1f1f; --text: #f2f2ee; --muted: #a0a09a;
      --line: #3a3a36; --ok-bg: #12301c; --err-bg: #3a1714; --ok: #6fd18c; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; min-height: 100dvh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  main { max-width: 520px; margin: 0 auto; }
  .brand { background: #fff; border-radius: 16px; padding: 14px 20px; margin: 4px 0 16px; text-align: center; }
  .brand img { display: block; margin: 0 auto; width: 100%; max-width: 200px; height: auto; }
  h1 { font-size: 1.5rem; margin: 0 0 20px; text-align: center; }
  h1 span { color: var(--accent-dark); }
  label.field-label { display: block; font-weight: 700; font-size: 1.05rem; margin-bottom: 8px; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  input[type=text] { width: 100%; min-height: 60px; font-size: 1.2rem; padding: 0 16px;
    border: 2px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--text); }
  input[type=text]:focus { outline: 3px solid var(--accent); border-color: var(--accent); }

  .photo { position: relative; display: flex; align-items: center; gap: 16px; min-height: 96px; cursor: pointer; }
  .photo input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
  .thumb { flex: none; width: 80px; height: 80px; border-radius: 12px; border: 2px dashed var(--line);
    display: grid; place-items: center; background: var(--bg); overflow: hidden; color: var(--muted); }
  .thumb svg { width: 44px; height: 44px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .photo.has-photo .thumb { border-style: solid; border-color: var(--ok); }
  .photo.has-photo .thumb img { display: block; }
  .photo.has-photo .thumb svg { display: none; }
  .photo-text { flex: 1; min-width: 0; }
  .photo-title { font-weight: 700; font-size: 1.1rem; }
  .photo-hint { color: var(--muted); font-size: .95rem; margin-top: 2px; }
  .photo.has-photo .photo-hint { color: var(--ok); }
  .photo:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 12px; }

  button#submit { width: 100%; min-height: 68px; font-size: 1.3rem; font-weight: 800; letter-spacing: .02em;
    border: 0; border-radius: 16px; background: var(--accent); color: #1b1b1b; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 12px; }
  button#submit:active { background: var(--accent-dark); }
  button#submit:disabled { opacity: .75; cursor: progress; }
  .spinner { width: 24px; height: 24px; border: 4px solid rgba(0,0,0,.25); border-top-color: #1b1b1b;
    border-radius: 50%; animation: spin .8s linear infinite; display: none; }
  button#submit.loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #message { display: none; margin-top: 16px; padding: 16px; border-radius: 12px; font-size: 1.1rem; font-weight: 600; }
  #message.ok { display: block; background: var(--ok-bg); color: var(--ok); }
  #message.err { display: block; background: var(--err-bg); color: var(--err); }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="images/logo.png" alt="Acme Construction" width="800" height="608"></div>
  <h1>Canopy <span>Inventory</span></h1>

  <form id="form" novalidate>
    <div class="card">
      <label class="field-label" for="worker">Your name</label>
      <input type="text" id="worker" name="worker" autocomplete="name" autocapitalize="words" placeholder="Enter your name">
    </div>

    <div class="card">
      <label class="photo" data-photo="canopy">
        <input type="file" id="canopy" accept="image/*" aria-label="Canopy ID photo">
        <span class="thumb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 3h18v18H3z" opacity="0"/><path d="M4 7h16v10H4z"/><path d="M8 11h3M8 14h6"/><circle cx="17" cy="11" r="1"/>
          </svg>
          <img alt="">
        </span>
        <span class="photo-text">
          <div class="photo-title">Canopy ID photo</div>
          <div class="photo-hint">Tap to take or upload a photo of the canopy ID label</div>
        </span>
      </label>
    </div>

    <div class="card">
      <label class="photo" data-photo="width">
        <input type="file" id="width" accept="image/*" aria-label="Width photo">
        <span class="thumb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12h18M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/><path d="M3 6v12M21 6v12"/>
          </svg>
          <img alt="">
        </span>
        <span class="photo-text">
          <div class="photo-title">Width photo</div>
          <div class="photo-hint">Tap to take or upload a photo showing the width</div>
        </span>
      </label>
    </div>

    <div class="card">
      <label class="photo" data-photo="length">
        <input type="file" id="length" accept="image/*" aria-label="Length photo">
        <span class="thumb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3"/><path d="M6 3h12M6 21h12"/>
          </svg>
          <img alt="">
        </span>
        <span class="photo-text">
          <div class="photo-title">Length photo</div>
          <div class="photo-hint">Tap to take or upload a photo showing the length</div>
        </span>
      </label>
    </div>

    <button type="submit" id="submit"><span class="spinner"></span><span id="submit-label">Submit</span></button>
    <div id="message" role="status" aria-live="polite"></div>
  </form>
</main>

<script>
(function () {
  'use strict';

  // Vercel function (api/submit.js) that forwards to n8n using the N8N_WEBHOOK_URL env var.
  var WEBHOOK_URL = '/api/submit';
  var TIMEOUT_MS = 60000;
  var MAX_DIMENSION = 1600; // long edge, px
  var JPEG_QUALITY = 0.8;
  var NAME_KEY = 'canopy.workerName';

  // One ID per canopy. Reused on every retry so n8n completes the same Airtable row
  // instead of creating a duplicate. Reset only after a successful submit.
  var submissionId = null;
  function newSubmissionId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
  }

  var form = document.getElementById('form');
  var workerInput = document.getElementById('worker');
  var submitBtn = document.getElementById('submit');
  var submitLabel = document.getElementById('submit-label');
  var message = document.getElementById('message');
  var photoIds = ['canopy', 'width', 'length'];
  var fieldNames = { canopy: 'canopy_id_photo', width: 'width_photo', length: 'length_photo' };

  try { workerInput.value = localStorage.getItem(NAME_KEY) || ''; } catch (e) {}

  function showMessage(type, text) {
    message.className = type;
    message.textContent = text;
  }
  function clearMessage() { message.className = ''; message.textContent = ''; }

  // Thumbnails
  var urls = {};
  function setThumb(id, file) {
    var label = document.querySelector('[data-photo="' + id + '"]');
    var img = label.querySelector('img');
    if (urls[id]) { URL.revokeObjectURL(urls[id]); delete urls[id]; }
    if (file) {
      urls[id] = URL.createObjectURL(file);
      img.src = urls[id];
      label.classList.add('has-photo');
      label.querySelector('.photo-hint').textContent = 'Photo added - tap to retake or replace';
    } else {
      img.removeAttribute('src');
      label.classList.remove('has-photo');
      label.querySelector('.photo-hint').textContent = label.dataset.hint;
    }
  }
  photoIds.forEach(function (id) {
    var label = document.querySelector('[data-photo="' + id + '"]');
    label.dataset.hint = label.querySelector('.photo-hint').textContent;
    document.getElementById(id).addEventListener('change', function (e) {
      setThumb(id, e.target.files[0]);
      clearMessage();
    });
  });

  // Downscale + convert to JPEG, return raw base64 (no data: prefix).
  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, MAX_DIMENSION / Math.max(img.naturalWidth, img.naturalHeight));
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', JPEG_QUALITY).split(',')[1]);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Could not read image')); };
      img.src = url;
    });
  }

  function setLoading(on) {
    submitBtn.disabled = on;
    submitBtn.classList.toggle('loading', on);
    submitLabel.textContent = on ? 'Submitting...' : 'Submit';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (submitBtn.disabled) return;

    var name = workerInput.value.trim();
    if (!name) { showMessage('err', 'Please enter your name.'); workerInput.focus(); return; }
    var missing = photoIds.filter(function (id) { return !document.getElementById(id).files[0]; });
    if (missing.length) {
      showMessage('err', 'Please add all three photos (missing: ' + missing.join(', ') + ').');
      return;
    }
    try { localStorage.setItem(NAME_KEY, name); } catch (err) {}

    clearMessage();
    setLoading(true);

    Promise.all(photoIds.map(function (id) { return fileToBase64(document.getElementById(id).files[0]); }))
      .then(function (b64) {
        if (!submissionId) submissionId = newSubmissionId();
        var body = { submission_id: submissionId, worker_name: name, submitted_at: new Date().toISOString() };
        photoIds.forEach(function (id, i) { body[fieldNames[id]] = b64[i]; });
        var ctrl = new AbortController();
        var timer = setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS);
        return fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: ctrl.signal
        }).finally(function () { clearTimeout(timer); });
      })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        photoIds.forEach(function (id) {
          document.getElementById(id).value = '';
          setThumb(id, null);
        });
        submissionId = null;
        showMessage('ok', 'Canopy submitted successfully.');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      })
      .catch(function () {
        showMessage('err', 'Something went wrong. Please try again.');
      })
      .then(function () { setLoading(false); });
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
